services:
  - type: web
    name: guest258
    env: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --timeout 120 --log-file -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: GUEST258_VERSION
        value: "2.4.1"
      - key: GUEST258_ENVIRONMENT
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: guest258-db
          property: connectionString
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: GUEST258_STORAGE_BACKEND
        value: local
      - key: DJANGO_MEDIA_ROOT
        value: /opt/render/project/src/media
      - key: DJANGO_SERVE_MEDIA
        value: "False"
      - key: GUEST258_PAYMENT_GATEWAY_MODE
        value: sandbox

databases:
  - name: guest258-db
    plan: starter
    databaseName: guest258
    user: guest258
